<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://vhgfyqodiieblhfwbama.supabase.co">
  <link rel="dns-prefetch" href="https://vhgfyqodiieblhfwbama.supabase.co">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/styles.css">
    <title>Sin conexión | IMMUJEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/cookies.js"></script>
    <script src="./js/theme-events.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
  <meta name="theme-color" content="#A506AD">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-startup-image" href="/Images/LOGO IMMUJEL.png">
</head>
<body class="bg-gradient-to-br from-purple-50 via-white to-blue-50 min-h-screen flex items-center justify-center p-4">
  <main class="text-center max-w-md w-full">
    <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-purple-100 flex items-center justify-center">
      <i class="fas fa-plug text-3xl text-purple-600" aria-hidden="true"></i>
    </div>
    <h1 class="text-3xl font-black text-gray-800 mb-3">Sin conexión</h1>
    <p class="text-gray-600 mb-6">Parece que no tienes conexión a Internet. Esta página se abrirá sola cuando vuelva; mientras tanto puedes ver lo que ya visitaste.</p>

    <!-- Solicitudes guardadas en este dispositivo (las llena el script de abajo) -->
    <p id="pendientes" hidden class="text-sm text-amber-900 bg-amber-100 border border-amber-300 rounded-xl p-3 mb-6" role="status"></p>

    <!-- Secciones que ya están guardadas y abren sin conexión -->
    <section id="disponibles" hidden class="text-left mb-8" aria-labelledby="titulo-disponibles">
      <h2 id="titulo-disponibles" class="text-sm font-bold text-gray-700 mb-2">Disponible sin conexión</h2>
      <ul id="lista-disponibles" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></ul>
    </section>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button type="button" id="reintentar" class="inline-block bg-purple-600 hover:bg-purple-700 text-white font-semibold px-8 py-3 rounded-xl transition shadow-md">
        <i class="fas fa-rotate-right mr-2" aria-hidden="true"></i> Reintentar
      </button>
      <a href="/" class="inline-block border border-purple-600 text-purple-700 hover:bg-purple-50 font-semibold px-8 py-3 rounded-xl transition">
        <i class="fas fa-home mr-2" aria-hidden="true"></i> Ir al inicio
      </a>
    </div>
    <div class="mt-12">
      <img src="/Images/LOGO IMMUJEL.png" alt="IMMUJEL" class="h-12 mx-auto opacity-50" loading="lazy">
    </div>
  </main>

  <script src="./js/offline-core.js?v=1"></script>
  <script src="./js/offline-db.js?v=1"></script>
  <script>
    (function () {
      var SECCIONES = [
        ['/', 'Inicio'],
        ['/navegacion/semanario', 'Semanario Institucional'],
        ['/navegacion/noticiero', 'Noticiero'],
        ['/navegacion/Programas', 'Programas'],
        ['/navegacion/Sobre%20Nosotras', 'Sobre nosotras'],
        ['/Forms/form', 'Solicitar asesoría'],
        ['/navegacion/FL', 'Fundamentos legales'],
        ['/navegacion/privacidad', 'Política de privacidad']
      ];

      document.getElementById('reintentar').addEventListener('click', function () { window.location.reload(); });
      // Al volver la conexión se abre la página que se había pedido, no solo el inicio
      window.addEventListener('online', function () { window.location.reload(); });

      // Solo se listan las secciones que de verdad están guardadas
      if ('caches' in window) {
        Promise.all(SECCIONES.map(function (s) {
          return caches.match(s[0]).then(function (hit) { return hit ? s : null; }, function () { return null; });
        })).then(function (lista) {
          var ul = document.getElementById('lista-disponibles');
          var hay = false;
          lista.forEach(function (s) {
            if (!s) return;
            hay = true;
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = s[0];
            a.textContent = s[1];
            a.className = 'block bg-white border border-purple-100 hover:bg-purple-50 text-purple-700 font-semibold text-sm rounded-xl px-4 py-2 transition';
            li.appendChild(a);
            ul.appendChild(li);
          });
          document.getElementById('disponibles').hidden = !hay;
        });
      }

      // Aviso de solicitudes guardadas por falta de conexión
      if (window.OfflineDB) {
        window.OfflineDB.resumen().then(function (r) {
          if (!r.pendientes) return;
          var p = document.getElementById('pendientes');
          p.textContent = r.pendientes === 1
            ? 'Tienes 1 solicitud guardada en este dispositivo: se enviará sola al volver la conexión.'
            : 'Tienes ' + r.pendientes + ' solicitudes guardadas en este dispositivo: se enviarán solas al volver la conexión.';
          p.hidden = false;
        }).catch(function () { /* sin IndexedDB */ });
      }
    })();
  </script>
</body>
</html>
